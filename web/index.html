<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>文 · 实时资讯工作台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <!-- 顶部通栏 -->
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btnMenu" title="导航">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo" id="logoHome" title="文 · 首页">
      <div class="logo-mark"><b>文</b></div>
      <div class="logo-text"><b>文</b><span>WEN</span></div>
    </div>

    <div class="global-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索新闻、热词、来源…" autocomplete="off" spellcheck="false">
      <kbd id="searchKbd">⌘ K</kbd>
      <button class="search-clear" id="searchClear">×</button>
    </div>

    <div class="top-meta">
      <div class="clock" id="clock">--:--</div>
      <div class="online" id="online"><i></i><span>连接中</span></div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnRefresh" title="刷新 (R)">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btnPin" title="窗口置顶">
        <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3v3H7v-2l3-3-1-7z"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换主题">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btnHelp" title="快捷键 (?)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.09A1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 20.96 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- 覆盖层 -->
<!-- 阅读浮层：点新闻才从右侧滑出 -->
<div class="reader-layer" id="readerLayer">
  <div class="reader-mask" data-act="closeReader"></div>
  <section class="reader-panel" id="reader"></section>
</div>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer"></div>
<div class="modal-wrap" id="modal"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
  /* 纯网页部署（EdgeOne Pages）：静态页 + 同源 Node Function 代理 */
  window.__PROXY__ = '/api/proxy?u=';
  window.__WEN_REMOTE__ = true;
</script>
<script src="js/news-core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
